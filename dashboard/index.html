<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Responsive Admin &amp; Dashboard Template based on Bootstrap 5">
	<meta name="author" content="AdminKit">
	<meta name="keywords" content="adminkit, bootstrap, bootstrap 5, admin, dashboard, template, responsive, css, sass, html, theme, front-end, ui kit, web">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="img/icons/icon-48x48.png" />

	<link rel="canonical" href="https://demo-basic.adminkit.io/" />

	<title>AdminKit Demo - Bootstrap 5 Admin Template</title>

	<link href="css/app.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
	<script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
	integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
	crossorigin=""/>
	<!-- Markercluster -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

		<!-- Make sure you put this AFTER Leaflet's CSS -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
	integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
	crossorigin=""></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster-src.js"></script>
    <script src="https://d3js.org/d3.v3.min.js"></script>
	
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			getLocationAndUpdate();
		});
	</script>
	
	</head>

<body>
	<div class="wrapper">
		<nav id="sidebar" class="sidebar js-sidebar">
			<div class="sidebar-content js-simplebar">
				<a class="sidebar-brand" href="index.html">
          <span class="align-middle">AdminKit</span>
        </a>

				<ul class="sidebar-nav">
					<li class="sidebar-header">
						Pages
					</li>

					<li class="sidebar-item active">
						<a class="sidebar-link" href="index.html">
              <i class="align-middle" data-feather="sliders"></i> <span class="align-middle">Dashboard</span>
            </a>
					</li>

			</div>
		</nav>

		<div class="main">
			<nav class="navbar navbar-expand navbar-light navbar-bg">
				<a class="sidebar-toggle js-sidebar-toggle">
          <i class="hamburger align-self-center"></i>
        </a>

			</nav>

			<main class="content">
				<div class="container-fluid p-0">
					<h1 class="h3 mb-3"><strong>Analytics</strong> Dashboard</h1>
			
					<div class="row">
						<!-- Top Left: weather Map Section -->
						<div class="col-md-6">
							<div class="card">
								<div class="card-header">
									<h5 class="card-title">Weather Stations Map</h5>
								</div>
								<div class="card-body">
									<div id="mapid" style="height: 307px;"></div>
								</div>
							</div>
						</div>
			
						<!-- Top Right: (weather D3 Chart Placeholder) -->
						<div class="col-md-6">
							<div class="card">
								<div class="card-header">
									<h5 class="card-title">Twenty Nearby Weather Stations</h5>
									<p id="update">Click to update the chart with live weather data.</p>
								</div>
								<div class="card-body">
											<div id="weather-chart" style="height: 270px;"></div> <!-- Chart will be injected here -->
								</div>
							</div>
						</div>
						
			
						 <!-- Bottom-left section (weather Chartjs chart) -->
						 <div class="col-md-6">
							<div class="card">
								<div class="card-header">
									<h5 class="card-title">Five Nearby Weather Stations</h5>
								</div>
								<div class="card-body">
									<canvas id="myChart" style="height: 270px;"></canvas>
								</div>
							</div>
						</div>
			
						<!-- Bottom Right: (My app map Placeholder) -->
						<div class="col-md-6">
							<div class="card">
								<div class="card-header">
									<h5 class="card-title">Nearby pharmacies Map</h5>
								</div>
								<div class="card-body">
									<div id="mapid2" style="height: 307px;"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</main>
			
			<!-- Include the JavaScript file -->
			<script src="js\location.js"></script>

			<script src="js\D3vertical.js"></script>
			<script src="js\excerciseMap.js"></script>
			<script src="js\chart.js"></script>
			<script src="js\clustering.js"></script>
			
</body>

</html>
